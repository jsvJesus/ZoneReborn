<div class="login-screen">

    <div class="login-top">

        <button
            type="button"
            data-locale="english">
            EN
        </button>

        <span>|</span>

        <button
            type="button"
            data-locale="chinese">
            ZH
        </button>

        <span>|</span>

        <button
            type="button"
            data-locale="russian">
            RU
        </button>

        <button
            id="loginClose"
            class="login-close"
            type="button">
            X
        </button>

    </div>


    <div class="login-card">

        <div
            id="loginCaption"
            class="login-caption">
        </div>

        <div class="login-content">

            <input
                id="loginName"
                class="login-input"
                type="text"
                maxlength="40"
                autocomplete="username">

            <input
                id="loginPassword"
                class="login-input"
                type="password"
                maxlength="40"
                autocomplete="current-password">


            <div class="login-divider"></div>


            <label class="login-remember">

                <input
                    id="loginRemember"
                    type="checkbox">

                <span class="login-toggle"></span>

                <span id="loginRememberText"></span>

            </label>


            <button
                id="loginButton"
                class="login-main-button"
                type="button"
                disabled>
            </button>


            <button
                id="loginRegister"
                class="login-link"
                type="button">
            </button>


            <button
                id="loginForgot"
                class="login-link"
                type="button">
            </button>


            <div
                id="loginError"
                class="login-error">
            </div>

        </div>

    </div>


    <div
        id="loginVersion"
        class="login-version">
    </div>

</div>
