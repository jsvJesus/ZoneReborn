<div class="login-screen">

    <div class="login-top">

        <button
            type="button"
            data-locale="english">
            EN
        </button>

        <span>|</span>

        <button
            type="button"
            data-locale="chinese">
            ZH
        </button>

        <span>|</span>

        <button
            type="button"
            data-locale="russian">
            RU
        </button>

        <button
            id="loginClose"
            class="login-close"
            type="button">
            X
        </button>

    </div>


    <div class="login-card">

        <div
            id="loginCaption"
            class="login-caption">
        </div>

        <div class="login-content">

            <input
                id="loginName"
                class="login-input"
                type="text"
                maxlength="40"
                autocomplete="username">

            <div class="login-password">
				<input
					id="loginPassword"
					class="login-input login-password-input"
					type="password"
					maxlength="40"
					autocomplete="current-password">
				<button
					id="loginPasswordToggle"
					class="login-password-toggle"
					type="button"
					tabindex="-1"
					aria-label="Show password">
					<svg
						class="login-password-eye"
						viewBox="0 0 24 24"
						aria-hidden="true">

						<path
							d="M2 12C4.6 7.8 7.9 5.7 12 5.7C16.1 5.7 19.4 7.8 22 12C19.4 16.2 16.1 18.3 12 18.3C7.9 18.3 4.6 16.2 2 12Z">
						</path>

						<circle
							cx="12"
							cy="12"
							r="3.2">
						</circle>

					</svg>
				</button>
			</div>

            <div class="login-divider"></div>

            <label class="login-remember">

                <input
                    id="loginRemember"
                    type="checkbox">

                <span class="login-toggle"></span>

                <span id="loginRememberText"></span>

            </label>


            <button
                id="loginButton"
                class="login-main-button"
                type="button"
                disabled>
            </button>


            <button
                id="loginRegister"
                class="login-link"
                type="button">
            </button>


            <button
                id="loginForgot"
                class="login-link"
                type="button">
            </button>


            <div
                id="loginError"
                class="login-error">
            </div>

        </div>

    </div>


    <div
        id="loginVersion"
        class="login-version">
    </div>

</div>
