<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,user-scalable=no">

    <title>Zone Reborn</title>

    <script>
        (() =>
        {
            const parameters =
                new URLSearchParams(
                    window.location.search);

            const version =
                parameters.get(
                    "v") ||
                String(
                    Date.now());

            const styles =
            [
                "./core/frontend.css",
                "./login/login.css",
                "./main/main.css",
                "./characters/dialog.css",
                "./characters/create.css",
                "./characters/clothes.css",
                "./characters/appearance.css"
            ];

            for (const path of styles)
            {
                document.write(
                    '<link rel="stylesheet" href="' +
                    path +
                    '?v=' +
                    encodeURIComponent(
                        version) +
                    '">');
            }

            const scripts =
            [
                "./core/frontend.js",
                "./characters/store.js",
                "./login/login.js",
                "./main/main.js",
                "./characters/dialog.js",
                "./characters/clothes.js",
                "./characters/appearance.js",
                "./characters/create.js",
                "./characters/edit.js"
            ];

            for (const path of scripts)
            {
                document.write(
                    '<script defer src="' +
                    path +
                    '?v=' +
                    encodeURIComponent(
                        version) +
                    '"><\/script>');
            }
        })();
    </script>
</head>

<body>

    <div id="frontend">

        <div id="startup">
            <canvas id="startupCanvas"></canvas>
        </div>

        <div
            id="sharedTop"
            class="main-top"
            hidden>

            <div class="main-account">
                <span id="sharedAccountName" class="main-account-name"></span>
                <span class="main-account-separator">|</span>
                <button id="sharedAccountId" class="main-account-id" type="button">
                    ID —
                </button>
            </div>

            <div class="main-balances">
                <div class="main-balance">
                    <canvas
                        class="main-balance-icon main-tga"
                        data-tga="/packs/res/soGUI/maps/MainMenu/Icons/money_gold.tga">
                    </canvas>
                    <span id="sharedSoftBalanceValue">0</span>
                </div>

                <div class="main-balance">
                    <canvas
                        class="main-balance-icon main-tga"
                        data-tga="/packs/res/soGUI/maps/MainMenu/Icons/money_silver.tga">
                    </canvas>
                    <span id="sharedPremiumBalanceValue">0</span>
                </div>
            </div>

            <div class="main-locales">
                <button type="button" data-shared-locale="english">EN</button>
                <span>|</span>
                <button type="button" data-shared-locale="chinese">ZH</button>
                <span>|</span>
                <button type="button" data-shared-locale="russian">RU</button>
            </div>

        </div>

        <div id="screenRoot"></div>

    </div>

</body>

</html>
