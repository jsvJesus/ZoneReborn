<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,user-scalable=no">

    <title>Zone Reborn</title>

    <style>
        html,
        body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;

			background: transparent;
		}

        #frontend {
            position: fixed;
			inset: 0;
			overflow: hidden;

			background: transparent;
        }

        #startup {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;

            z-index: 10;
        }

        #startup canvas {
            display: block;

            max-width: 100vw;
            max-height: 100vh;
        }

        #flash {
            position: absolute;
			inset: 0;

			display: none;

			background: transparent;
        }

        ruffle-player {
            width: 100%;
			height: 100%;

			display: block;

			background: transparent;
        }
    </style>

    <script>
		window.RufflePlayer =
			window.RufflePlayer || {};

		window.RufflePlayer.config = {
			publicPath: "./ruffle/",

			autoplay: "on",

			// Не показывать эту ебаную кнопку "Включить звук".
			unmuteOverlay: "hidden",

			allowScriptAccess: true,

			warnOnUnsupportedContent: true,

			logLevel: "debug",
			
			wmode: "transparent",
			backgroundColor: null
		};

		// Перехватываем ошибки Ruffle ДО загрузки ruffle.js
		// и отправляем их в консоль ZoneReborn.
		(() =>
		{
			const levels = [
				"log",
				"warn",
				"error"
			];

			for (const level of levels)
			{
				const original =
					console[level].bind(console);

				console[level] =
					(...args) =>
					{
						original(...args);

						try
						{
							const text =
								args
									.map(value =>
									{
										if (typeof value === "string")
										{
											return value;
										}

										try
										{
											return JSON.stringify(value);
										}
										catch
										{
											return String(value);
										}
									})
									.join(" ");

							if (window.chrome &&
								window.chrome.webview)
							{
								window.chrome.webview.postMessage(
									"trace\t" +
									encodeURIComponent(
										"[Ruffle " +
										level +
										"] " +
										text));
							}
						}
						catch
						{
						}
					};
			}
		})();
	</script>

    <script src="./ruffle/ruffle.js"></script>
    <script defer src="./frontend.js"></script>
</head>

<body>
    <div id="frontend">
        <div id="startup">
            <canvas id="startupCanvas"></canvas>
        </div>

        <div id="flash"></div>
    </div>
</body>
</html>
