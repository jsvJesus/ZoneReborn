<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,user-scalable=no">

    <title>Zone Reborn</title>

    <script>
        (() =>
        {
            const parameters =
                new URLSearchParams(
                    window.location.search);

            const version =
                parameters.get(
                    "v") ||
                String(
                    Date.now());

            const styles =
            [
                "./core/frontend.css",
                "./login/login.css",
                "./main/main.css",
                "./characters/dialog.css",
                "./characters/create.css",
                "./characters/appearance.css"
            ];

            for (const path of styles)
            {
                document.write(
                    '<link rel="stylesheet" href="' +
                    path +
                    '?v=' +
                    encodeURIComponent(
                        version) +
                    '">');
            }

            const scripts =
            [
                "./core/frontend.js",
                "./characters/store.js",
                "./login/login.js",
                "./main/main.js",
                "./characters/dialog.js",
                "./characters/appearance.js",
                "./characters/create.js"
            ];

            for (const path of scripts)
            {
                document.write(
                    '<script defer src="' +
                    path +
                    '?v=' +
                    encodeURIComponent(
                        version) +
                    '"><\/script>');
            }
        })();
    </script>
</head>

<body>

    <div id="frontend">

        <div id="startup">
            <canvas id="startupCanvas"></canvas>
        </div>

        <div id="screenRoot"></div>

    </div>

</body>

</html>
