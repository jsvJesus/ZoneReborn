<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,user-scalable=no">

    <title>Zone Reborn</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #frontend {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #000;
        }

        #startup {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;

            z-index: 10;
        }

        #startup canvas {
            display: block;

            max-width: 100vw;
            max-height: 100vh;
        }

        #flash {
            position: absolute;
            inset: 0;

            display: none;

            background: #000;
        }

        ruffle-player {
            width: 100%;
            height: 100%;

            display: block;

            background: #000;
        }
    </style>

    <script>
        window.RufflePlayer =
            window.RufflePlayer || {};

        window.RufflePlayer.config = {
            publicPath: "./ruffle/"
        };
    </script>

    <script src="./ruffle/ruffle.js"></script>
    <script defer src="./frontend.js"></script>
</head>

<body>
    <div id="frontend">
        <div id="startup">
            <canvas id="startupCanvas"></canvas>
        </div>

        <div id="flash"></div>
    </div>
</body>
</html>
