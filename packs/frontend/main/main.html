<div class="main-screen">

    <div class="main-vignette"></div>


    <div class="main-top">

        <div class="main-account">

            <span
                id="mainAccountName"
                class="main-account-name">
            </span>

            <span class="main-account-separator">
                |
            </span>

            <button
                id="mainAccountId"
                class="main-account-id"
                type="button">
                ID —
            </button>

        </div>


        <div class="main-balances">

            <div
                class="main-balance"
                id="mainSoftBalance">

                <img
                    class="main-balance-icon"
                    src="/packs/res/soGUI/frame/paint/icon_money.png"
                    alt="">

                <span id="mainSoftBalanceValue">
                    0
                </span>

            </div>


            <div
                class="main-balance"
                id="mainPremiumBalance">

                <canvas
                    class="main-balance-icon main-tga"
                    data-tga="/packs/res/soGUI/maps/premium/premium.tga">
                </canvas>

                <span id="mainPremiumBalanceValue">
                    0
                </span>

            </div>

        </div>


        <button
            id="mainStore"
            class="main-top-action"
            type="button">

            <img
                src="/packs/res/soGUI/frame/inventory/storage_open.png"
                alt="">

            <span data-i18n="store">
                МАГАЗИН
            </span>

        </button>


        <button
            id="mainStorage"
            class="main-top-action main-storage-action"
            type="button">

            <img
                src="/packs/res/soGUI/frame/inventory/storage.png"
                alt="">

            <span data-i18n="storage">
                СКЛАД
            </span>

        </button>


        <div class="main-locales">

            <button
                type="button"
                data-locale="english">
                EN
            </button>

            <span>|</span>

            <button
                type="button"
                data-locale="chinese">
                ZH
            </button>

            <span>|</span>

            <button
                type="button"
                data-locale="russian">
                RU
            </button>

        </div>

    </div>


    <aside class="main-left">

        <div
            class="main-title"
            data-i18n="mainTitle">
            ГЛАВНОЕ МЕНЮ
        </div>


        <button
            id="mainPlay"
            class="main-play"
            type="button"
            data-i18n="startGame">
            НАЧАТЬ ИГРУ
        </button>


        <div
            class="main-section-title"
            data-i18n="myCharacter">
            МОЙ ПЕРСОНАЖ
        </div>


        <div
            id="mainCharacterList"
            class="main-character-list">
        </div>


        <nav class="main-navigation">

            <button
                type="button"
                data-action="settings"
                data-i18n="settings">
                НАСТРОЙКИ
            </button>

            <button
                type="button"
                data-action="partner"
                data-i18n="partner">
                ПАРТНЕРСКАЯ ПРОГРАММА
            </button>

            <button
                type="button"
                data-action="promo"
                data-i18n="promo">
                ВВЕСТИ ПРОМОКОД
            </button>

            <button
                type="button"
                data-action="support"
                data-i18n="support">
                ТЕХПОДДЕРЖКА
            </button>

            <button
                type="button"
                data-action="news"
                data-i18n="news">
                НОВОСТИ
            </button>

            <button
                type="button"
                data-action="license"
                data-i18n="license">
                ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ
            </button>

        </nav>


        <div class="main-divider"></div>


        <button
            id="mainExit"
            class="main-exit"
            type="button"
            data-i18n="exit">
            ВЫХОД
        </button>

    </aside>


    <div
        id="characterRotateArea"
        class="character-rotate-area">
    </div>


    <aside class="main-right">

        <button
            class="main-promo-card"
            type="button"
            data-action="appearance">

            <div
                class="promo-title"
                data-i18n="appearanceTitle">
                МОДИФИКАЦИЯ ВНЕШНОСТИ
            </div>

            <div class="promo-body">

                <div class="promo-image">

                    <canvas
                        class="main-tga"
                        data-tga="/packs/res/soGUI/maps/MainMenu/Card/card_icon_head.png">
                    </canvas>

                </div>

                <div
                    class="promo-description"
                    data-i18n="appearanceDescription">
                    Здесь доступны любые формы изменения внешности.
                </div>

            </div>

        </button>


        <button
            class="main-promo-card"
            type="button"
            data-action="equipment">

            <div
                class="promo-title"
                data-i18n="equipmentTitle">
                МОДИФИКАЦИЯ ЭКИПИРОВКИ
            </div>

            <div class="promo-body">

                <div class="promo-image">

                    <canvas
                        class="main-tga"
                        data-tga="/packs/res/soGUI/maps/MainMenu/Card/card_icon_body.png">
                    </canvas>

                </div>

                <div
                    class="promo-description"
                    data-i18n="equipmentDescription">
                    Изменяйте внешний вид своей экипировки.
                </div>

            </div>

        </button>


        <button
            class="main-promo-card"
            type="button"
            data-action="premium">

            <div
                class="promo-title"
                data-i18n="premiumTitle">
                ПРЕМИАЛЬНАЯ ПОДПИСКА
            </div>

            <div class="promo-body">

                <div class="promo-image promo-image-premium">

                    <canvas
                        class="main-tga"
                        data-tga="/packs/res/soGUI/maps/MainMenu/Card/card_icon_premium.png">
                    </canvas>

                </div>

                <div
                    class="promo-description"
                    data-i18n="premiumDescription">
                    Получайте увеличенный опыт и другие преимущества.
                </div>

            </div>

        </button>
		
		<button
            class="main-promo-card"
            type="button"
            data-action="store">

            <div
                class="promo-title"
                data-i18n="premiumTitle">
                МАГАЗИН ПРЕДМЕТОВ
            </div>

            <div class="promo-body">

                <div class="promo-image promo-image-shop">

                    <canvas
                        class="main-tga"
                        data-tga="/packs/res/soGUI/maps/MainMenu/Card/card_icon_store.png">
                    </canvas>

                </div>

                <div
                    class="promo-description"
                    data-i18n="premiumDescription">
                    Получайте увеличенный опыт и другие преимущества.
                </div>

            </div>

        </button>
		
		<button
            class="main-promo-card"
            type="button"
            data-action="storage">

            <div
                class="promo-title"
                data-i18n="premiumTitle">
                ХРАНИЛИЩЕ
            </div>

            <div class="promo-body">

                <div class="promo-image promo-image-shop">

                    <canvas
                        class="main-tga"
                        data-tga="/packs/res/soGUI/maps/MainMenu/Card/card_icon_storage.png">
                    </canvas>

                </div>

                <div
                    class="promo-description"
                    data-i18n="premiumDescription">
                    Получайте увеличенный опыт и другие преимущества.
                </div>

            </div>

        </button>

    </aside>


    <div
        id="mainVersion"
        class="main-version">
    </div>

</div>
