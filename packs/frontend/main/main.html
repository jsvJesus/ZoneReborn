<div class="main-screen">

    <div class="main-vignette"></div>


    <div class="main-account">

        <span id="mainAccountName"></span>

        <span class="account-id">
            id
        </span>

        <span class="account-notification">
            !
        </span>

    </div>


    <div class="main-top">

        <button
            id="mainStore"
            type="button">
            ◆ МАГАЗИН
        </button>

        <button
            id="mainStorage"
            type="button">
            ◆ СКЛАД
        </button>

        <div class="main-locales">

            <button
                type="button"
                data-locale="english">
                EN
            </button>

            <span>|</span>

            <button
                type="button"
                data-locale="chinese">
                ZH
            </button>

            <span>|</span>

            <button
                type="button"
                data-locale="russian">
                RU
            </button>

        </div>

        <!--<button
            id="mainClose"
            class="main-close"
            type="button">
            X
        </button>-->

    </div>


    <aside class="main-left">

        <div
            id="mainTitle"
            class="main-title">
            ГЛАВНОЕ МЕНЮ
        </div>


        <button
            id="mainPlay"
            class="main-play"
            type="button">
            НАЧАТЬ ИГРУ
        </button>


        <div class="main-section-title">
            МОИ ПЕРСОНАЖИ
        </div>


        <div
            id="mainCharacterList"
            class="main-character-list">
        </div>


        <nav class="main-navigation">

            <button type="button" data-action="settings">
                НАСТРОЙКИ
            </button>

            <button type="button" data-action="partner">
                ПАРТНЕРСКАЯ ПРОГРАММА
            </button>

            <button type="button" data-action="promo">
                ВВЕСТИ ПРОМОКОД
            </button>

            <button type="button" data-action="support">
                ТЕХПОДДЕРЖКА
            </button>

            <button type="button" data-action="news">
                НОВОСТИ
            </button>

            <button type="button" data-action="license">
                ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ
            </button>

        </nav>


        <div class="main-divider"></div>


        <button
            id="mainExit"
            class="main-exit"
            type="button">
            ВЫХОД
        </button>

    </aside>


    <div
        id="characterRotateArea"
        class="character-rotate-area">
    </div>


    <aside class="main-right">

        <button
            class="main-promo-card"
            type="button"
            data-action="appearance">

            <div class="promo-title">
                МОДИФИКАЦИЯ ВНЕШНОСТИ
            </div>

            <div class="promo-body">

                <div class="promo-icon promo-head">
                    ◉
                </div>

                <div class="promo-description">
                    Здесь доступны любые формы
                    изменения внешности, если она
                    Вам надоела.
                </div>

            </div>

        </button>


        <button
            class="main-promo-card"
            type="button"
            data-action="equipment">

            <div class="promo-title">
                МОДИФИКАЦИЯ ЭКИПИРОВКИ
            </div>

            <div class="promo-body">

                <div class="promo-icon">
                    ◈
                </div>

                <div class="promo-description">
                    Покрасьте свою одежду в любой
                    из представленных камуфляжей.
                    Соберите свой уникальный сет.
                </div>

            </div>

        </button>


        <button
            class="main-promo-card"
            type="button"
            data-action="premium">

            <div class="promo-title">
                ПРЕМИАЛЬНАЯ ПОДПИСКА
            </div>

            <div class="promo-body">

                <div class="promo-icon promo-star">
                    ★
                </div>

                <div class="promo-description">
                    Подключите, чтобы получать
                    увеличенный опыт и другие
                    интересные преимущества.
                </div>

            </div>

        </button>

    </aside>


    <div
        id="mainVersion"
        class="main-version">
    </div>

</div>
