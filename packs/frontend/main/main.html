<div class="main-screen">

    <div class="main-vignette"></div>


    <div class="main-top">

        <div class="main-account">

            <span
                id="mainAccountName"
                class="main-account-name">
            </span>

            <span class="main-account-separator">
                |
            </span>

            <button
                id="mainAccountId"
                class="main-account-id"
                type="button">
                ID —
            </button>

        </div>


        <div class="main-balances">

            <div
                class="main-balance"
                id="mainSoftBalance">

                <img
                    class="main-balance-icon"
                    src="/packs/res/soGUI/frame/paint/icon_money.png"
                    alt="">

                <span id="mainSoftBalanceValue">
                    0
                </span>

            </div>


            <div
                class="main-balance"
                id="mainPremiumBalance">

                <canvas
                    class="main-balance-icon main-tga"
                    data-tga="/packs/res/soGUI/maps/premium/premium.tga">
                </canvas>

                <span id="mainPremiumBalanceValue">
                    0
                </span>

            </div>

        </div>

        <div class="main-locales">

            <button
                type="button"
                data-locale="english">
                EN
            </button>

            <span>|</span>

            <button
                type="button"
                data-locale="chinese">
                ZH
            </button>

            <span>|</span>

            <button
                type="button"
                data-locale="russian">
                RU
            </button>

        </div>

    </div>


    <aside class="main-left">
		<div class="main-left-panel">
			<div class="main-menu-header">
				<div class="main-menu-header-line"></div>
				<div class="main-title" data-i18n="mainTitle">ГЛАВНОЕ МЕНЮ</div>
			</div>

			<button id="mainPlay" class="main-play" type="button">
				<span class="main-play-title" data-i18n="startGame">НАЧАТЬ ИГРУ</span>
				<span class="main-play-arrow">›</span>
			</button>
			&nbsp;
			&nbsp;
			<section class="main-character-section">
				<div class="main-section-header">
					<span data-i18n="myCharacter">МОЙ ПЕРСОНАЖ</span>
					<span class="main-section-header-line"></span>
				</div>
				<div id="mainCharacterList" class="main-character-list"></div>
			</section>
			&nbsp;
			&nbsp;
			<nav class="main-navigation">
				<button type="button" data-action="settings">
					<span class="main-navigation-marker"></span>
					<span data-i18n="settings">НАСТРОЙКИ</span>
				</button>

				<button type="button" data-action="partner">
					<span class="main-navigation-marker"></span>
					<span data-i18n="partner">ПАРТНЕРСКАЯ ПРОГРАММА</span>
				</button>

				<button type="button" data-action="promo">
					<span class="main-navigation-marker"></span>
					<span data-i18n="promo">ВВЕСТИ ПРОМОКОД</span>
				</button>

				<button type="button" data-action="support">
					<span class="main-navigation-marker"></span>
					<span data-i18n="support">ТЕХПОДДЕРЖКА</span>
				</button>

				<button type="button" data-action="news">
					<span class="main-navigation-marker"></span>
					<span data-i18n="news">НОВОСТИ</span>
				</button>

				<button type="button" data-action="license">
					<span class="main-navigation-marker"></span>
					<span data-i18n="license">ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ</span>
				</button>
			</nav>

			<div class="main-divider"></div>

			<button id="mainExit" class="main-exit" type="button">
				<span class="main-navigation-marker"></span>
				<span data-i18n="exit">ВЫХОД</span>
			</button>
		</div>
	</aside>


    <div
        id="characterRotateArea"
        class="character-rotate-area">
    </div>


    <aside class="main-right">

        <button
            class="main-promo-card"
            type="button"
            data-action="appearance">

            <div
                class="promo-title"
                data-i18n="appearanceTitle">
                МОДИФИКАЦИЯ ВНЕШНОСТИ
            </div>

            <div class="promo-body">

                <div class="promo-image">

                    <canvas
                        class="main-tga"
                        data-tga="/packs/res/soGUI/maps/MainMenu/Card/card_icon_head.tga">
                    </canvas>

                </div>

                <div
                    class="promo-description"
                    data-i18n="appearanceDescription">
                    Здесь доступны любые формы изменения внешности.
                </div>

            </div>

        </button>


        <button
            class="main-promo-card"
            type="button"
            data-action="equipment">

            <div
                class="promo-title"
                data-i18n="equipmentTitle">
                МОДИФИКАЦИЯ ЭКИПИРОВКИ
            </div>

            <div class="promo-body">

                <div class="promo-image">

                    <canvas
                        class="main-tga"
                        data-tga="/packs/res/soGUI/maps/MainMenu/Card/card_icon_body.tga">
                    </canvas>

                </div>

                <div
                    class="promo-description"
                    data-i18n="equipmentDescription">
                    Изменяйте внешний вид своей экипировки.
                </div>

            </div>

        </button>


        <button
            class="main-promo-card"
            type="button"
            data-action="premium">

            <div
                class="promo-title"
                data-i18n="premiumTitle">
                ПРЕМИАЛЬНАЯ ПОДПИСКА
            </div>

            <div class="promo-body">

                <div class="promo-image promo-image-premium">

                    <canvas
                        class="main-tga"
                        data-tga="/packs/res/soGUI/maps/MainMenu/Card/card_icon_premium.tga">
                    </canvas>

                </div>

                <div
                    class="promo-description"
                    data-i18n="premiumDescription">
                    Получайте увеличенный опыт и другие преимущества.
                </div>

            </div>

        </button>
		
		<button
            class="main-promo-card"
            type="button"
            data-action="store">

            <div
                class="promo-title"
                data-i18n="storeTitle">
                МАГАЗИН ПРЕДМЕТОВ
            </div>

            <div class="promo-body">

                <div class="promo-image promo-image-shop">

                    <canvas
                        class="main-tga"
                        data-tga="/packs/res/soGUI/maps/MainMenu/Card/card_icon_store.tga">
                    </canvas>

                </div>

                <div
                    class="promo-description"
                    data-i18n="storeDescription">
                    Магазин, где продаются предметы и различные предметы кастомизации.
                </div>

            </div>

        </button>
		
		<button
            class="main-promo-card"
            type="button"
            data-action="storage">

            <div
                class="promo-title"
                data-i18n="storageTitle">
                ХРАНИЛИЩЕ
            </div>

            <div class="promo-body">

                <div class="promo-image promo-image-shop">

                    <canvas
                        class="main-tga"
                        data-tga="/packs/res/soGUI/maps/MainMenu/Card/card_icon_storage.tga">
                    </canvas>

                </div>

                <div
                    class="promo-description"
                    data-i18n="storageDescription">
                    Все приобретенные вами товары доставлены на склад.
                </div>

            </div>

        </button>

    </aside>


    <div
        id="mainVersion"
        class="main-version">
    </div>

</div>
